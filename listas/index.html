<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<title>Listas · Cidadão do Mundo</title>
<meta name="theme-color" content="#111110">
<link rel="icon" type="image/png" href="../icon-192.png">
<!-- PÁGINA PRÓPRIA DAS LISTAS (24/10/2026, bloco 1 do painel em módulos). A casca (docs/sistema.html) abre
     listas/index.html#pedidos ou #financeiro (docs/casca/paginas.js) e esta página carrega só o núcleo comum e o
     módulo Listas: nada da carga de vendas do painel. O código das telas é o mesmo do painel antigo
     (docs/listas/listas.js); o painel antigo continua abrindo as Listas como antes. Quem mexe: o chat "Telas do painel". -->
<script>
  // aqui a casca abre a página sem ?casca=1: dentro de moldura da mesma origem é casca
  const NA_CASCA = window.parent !== window;
  if (NA_CASCA) document.documentElement.classList.add('na-casca');
  function avisarCasca(msg) { if (NA_CASCA) { try { parent.postMessage(msg, location.origin); } catch (e) {} } }
</script>
<link rel="stylesheet" href="../nucleo/nucleo.css?v=20261029w">
<style>
  .na-casca body::before { display:none !important; }
</style>
</head>
<body>
<div class="main-content">
  <div class="wrap">
    <div id="erroMsg" style="display:none;"></div>
    <div id="modulo-listas" class="modulo" style="display:none;"><div id="view-listas"></div></div>
    <div id="modulo-listasfin" class="modulo" style="display:none;"><div id="view-listasfin"></div></div>
  </div>
</div>

<script src="../nucleo/nucleo.js?v=20261029t"></script>
<script src="../nucleo/loja.js?v=20261028a"></script>
<script src="listas.js?v=20261029b"></script>
<script>
// O que é desta página: qual das duas telas abrir e a porta quando a sessão vence (consultarTudo chama exigirLogin).
const TELA = location.hash === '#financeiro' ? 'listasfin' : 'listas';
function exigirLogin(recado) {
  localStorage.removeItem('rmbSessao');
  if (NA_CASCA) { avisarCasca({ tipo: 'casca-login', recado: recado || '' }); return; }
  location.href = '../sistema.html#' + TELA;   // aberta solta (botão "abrir"): a porta é a da casca
}
function abrirListas() {
  document.getElementById(TELA === 'listasfin' ? 'modulo-listasfin' : 'modulo-listas').style.display = '';
  registrarUso(TELA);
  avisarCasca({ tipo: 'casca-modulo', nome: TELA });
  try { (TELA === 'listasfin' ? entrarListasFin : entrarListas)(); }
  catch (e) {
    const el = document.getElementById('erroMsg');
    el.style.display = 'block'; el.textContent = 'Erro ao abrir as Listas: ' + e.message;
  }
}
// a casca reabre a tela já carregada: recarrega os dados, como o painel antigo faz no mostrarModulo
window.reentrarTela = () => { try { (TELA === 'listasfin' ? entrarListasFin : entrarListas)(); } catch (e) {} };
window.addEventListener('hashchange', () => location.reload());
abrirListas();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('../sw.js').catch(() => {});
}
</script>
</body>
</html>
