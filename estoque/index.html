<!-- PÁGINA PRÓPRIA DE PRODUÇÃO E ESTOQUE (24/10/2026, bloco 2 do painel em módulos), no molde de listas/index.html.
     A casca abre estoque/index.html#contagem, #plprod, #separacao, #ordens, #producao, #controle ou #posicao (docs/casca/paginas.js); a
     página carrega só o núcleo comum e docs/estoque/estoque.js — o mesmo código que o painel antigo usa.
     Quem mexe: o chat "Telas do painel". -->
<script>
  // aqui a casca abre a página sem ?casca=1: dentro de moldura da mesma origem é casca
  const NA_CASCA = window.parent !== window;
  if (NA_CASCA) document.documentElement.classList.add('na-casca');
  function avisarCasca(msg) { if (NA_CASCA) { try { parent.postMessage(msg, location.origin); } catch (e) {} } }
</script>
<link rel="stylesheet" href="../nucleo/nucleo.css?v=20261029t">
<style>
  .na-casca body::before { display:none !important; }
</style>
</head>
<body>
<div class="main-content">
  <div class="wrap">
    <div id="erroMsg" style="display:none;"></div>
    <div id="modulo-contagem" class="modulo" style="display:none;"><div id="view-contagem"></div></div>
    <div id="modulo-processos" class="modulo papel lanc" style="display:none;"><div id="view-processos"></div></div>
    <div id="modulo-plprod" class="modulo papel lanc" style="display:none;"><div id="view-plprod"></div></div>
    <div id="modulo-separacao" class="modulo papel lanc" style="display:none;"><div id="view-separacao"></div></div>
    <div id="modulo-ordens" class="modulo papel lanc" style="display:none;"><div id="view-ordens"></div></div>

    <div id="modulo-conferencias" class="modulo papel lanc" style="display:none;"><div id="view-conferencias"></div></div>
    <div id="modulo-controle" class="modulo" style="display:none;"><div id="view-controle"></div></div>
    <div id="modulo-posicao" class="modulo" style="display:none;"><div id="view-posicao"></div></div>
  </div>
</div>

<script src="../nucleo/nucleo.js?v=20261029t"></script>
<script src="../nucleo/loja.js?v=20261028a"></script>
<script src="estoque.js?v=20261029d"></script>
<script>
// O que é desta página: qual das cinco telas abrir, o atalho entre elas e a porta quando a sessão vence.
// 27/10/2026 (dono): o ciclo em quatro telas — Planejar, Separação, Ordens, Apontar
const TELAS = { contagem: entrarContagem, processos: entrarProcessos, plprod: entrarPlprod, separacao: entrarSeparacao, ordens: entrarOrdens, producao: entrarApontar,
                prodhist: entrarProdHist, conferencias: entrarConferencias,
                controle: entrarControle, posicao: entrarPosicao };
const TELA = TELAS[location.hash.slice(1)] ? location.hash.slice(1) : 'contagem';
function exigirLogin(recado) {
  localStorage.removeItem('rmbSessao');
  if (NA_CASCA) { avisarCasca({ tipo: 'casca-login', recado: recado || '' }); return; }
  location.href = '../sistema.html#' + TELA;   // aberta solta (botão "abrir"): a porta é a da casca
}
// atalho de uma tela para outra (ex.: gerar ordem → Apontar): na casca, ela abre a outra tela; solta, troca o endereço
function mostrarModulo(nome) {
  if (NA_CASCA) { avisarCasca({ tipo: 'casca-modulo', nome }); return; }
  location.hash = nome;
}
function abrirTela() {
  document.getElementById('modulo-' + TELA).style.display = '';
  registrarUso(TELA);
  avisarCasca({ tipo: 'casca-modulo', nome: TELA });
  try { TELAS[TELA](); }
  catch (e) {
    const el = document.getElementById('erroMsg');
    el.style.display = 'block'; el.textContent = 'Erro ao abrir a tela: ' + e.message;
  }
}
// a casca reabre a tela já carregada: recarrega os dados, como o painel antigo faz no mostrarModulo
window.reentrarTela = () => { try { TELAS[TELA](); } catch (e) {} };
window.addEventListener('hashchange', () => location.reload());
abrirTela();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('../sw.js').catch(() => {});
}
</script>
</body>
