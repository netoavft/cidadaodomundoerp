     o mesmo código que o painel antigo usa. Quem mexe: o chat "Telas do painel". -->
<script>
  // aqui a casca abre a página sem ?casca=1: dentro de moldura da mesma origem é casca
  const NA_CASCA = window.parent !== window;
  if (NA_CASCA) document.documentElement.classList.add('na-casca');
  function avisarCasca(msg) { if (NA_CASCA) { try { parent.postMessage(msg, location.origin); } catch (e) {} } }
</script>
<link rel="stylesheet" href="../nucleo/nucleo.css?v=20261024e">

</style>

  localStorage.removeItem('rmbSessao');
  if (NA_CASCA) { avisarCasca({ tipo: 'casca-login', recado: recado || '' }); return; }
  location.href = '../sistema.html#' + TELA;   // aberta solta (botão "abrir"): a porta é a da casca

// atalho de uma tela para outra (ex.: gerar ordem → Apontar): na casca, ela abre a outra tela; solta, troca o endereço
function mostrarModulo(nome) {
  if (NA_CASCA) { avisarCasca({ tipo: 'casca-modulo', nome }); return; }
  location.hash = nome;
}
function abrirTela() {
  document.getElementById('modulo-' + TELA).style.display = '';
  registrarUso(TELA);
  avisarCasca({ tipo: 'casca-modulo', nome: TELA });
  try { TELAS[TELA](); }
  catch (e) {
    const el = document.getElementById('erroMsg');
    el.style.display = 'block'; el.textContent = 'Erro ao abrir a tela: ' + e.message;
  }
}
// a casca reabre a tela já carregada: recarrega os dados, como o painel antigo faz no mostrarModulo

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('../sw.js').catch(() => {});
}
