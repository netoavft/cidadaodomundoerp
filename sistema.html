<!--
  A CASCA DO PAINEL (14/10/2026)

  Pedido do dono: "Pode começar pela casca, no mesmo modelo do portal do Fabio, com o
  painel atual dentro dela." É o passo 0 da divisão do painel em módulos — o mapa e a
  ordem dos blocos estão em contexto/project_painel_em_modulos.md.

  Como funciona:
  - LOGIN: o mesmo do painel (Supabase, e-mail e senha) e a MESMA sessão ('rmbSessao' no
    localStorage). Quem entra aqui entra no painel, e vice-versa.
  - MENU: docs/casca/menu.js, GERADO do menu lateral do dashboard.html por
    script/gerar_menu_casca.py. Não se escreve menu aqui. Quem vê o quê continua sendo
    painel_acesso / rpc meus_modulos — e, como no painel, isso organiza a tela, não é cofre.
  - MOLDURA: toda tela abre dentro do painel antigo (dashboard.html?casca=1), que esconde
    o menu dele e avisa a casca de qual tela está aberta. Tela que já saiu para página
    própria está em docs/casca/paginas.js e abre na sua moldura, sem carregar o painel.
  - RENOVAÇÃO DE SESSÃO: a casca só renova o token na abertura, ANTES de existir a
    moldura. Depois quem renova é o painel. O refresh_token do Supabase é de uso único:
    dois renovando ao mesmo tempo derrubam o login (a lição de 21/08 no dashboard.html).
-->
<style>
  :root {
    /* os mesmos tokens do painel (docs/dashboard.html, :root) */
    --bg:#111110; --surface:#1e1e1c; --surface-2:#2a2a27; --zebra:#171716;
    --line:#34332f; --line-2:#45443f;
    --tx-1:#fff; --tx-2:#c3c2b7; --tx-3:#a5a49a; --tx-5:#82817a; --tx-6:#6b6a61;
    --brand:#c8102e; --farol-fora:#ff6b6b;
    --marca-amarelo:#f6c63e; --marca-laranja:#ee8a3c; --marca-laranja-q:#e2622b;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--tx-1);
         font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif; font-size:14px; }
  body::before { content:''; position:fixed; top:0; left:0; right:0; height:3px; z-index:60;
    background:linear-gradient(90deg,var(--marca-amarelo),var(--marca-laranja),var(--marca-laranja-q)); }
  button { font-family:inherit; }

  .app { display:flex; height:100%; }
  .side { width:250px; flex:0 0 250px; background:var(--surface); border-right:1px solid var(--line);
          padding:16px 12px 12px; display:flex; flex-direction:column; overflow-y:auto; }
  .marca { display:flex; align-items:center; gap:10px; padding:12px 14px; margin:0 0 12px; border-radius:12px;
           background:linear-gradient(135deg,var(--marca-amarelo),var(--marca-laranja) 70%,var(--marca-laranja-q)); }
  .marca img { height:38px; width:38px; border-radius:9px; object-fit:cover; flex-shrink:0; }
  .marca span { color:var(--bg); font-size:14px; font-weight:800; letter-spacing:.3px; flex:1; text-align:center; }
  .mi { display:flex; align-items:center; gap:9px; width:100%; background:none; border:none; color:var(--tx-2);
        font-size:13.5px; font-weight:700; text-align:left; padding:9px 12px; border-radius:10px; cursor:pointer; }
  .mi:hover { background:var(--surface-2); color:var(--tx-1); }
  .mi.on { background:var(--brand); color:var(--tx-1); }
  .mi:focus-visible, .grp:focus-visible, .btn:focus-visible, .card:focus-visible { outline:2px solid var(--marca-amarelo); outline-offset:1px; }
  .mi .ic { width:18px; text-align:center; flex-shrink:0; font-size:13px; }
  .grp { display:flex; align-items:center; width:100%; background:none; border:none; border-top:1px solid var(--line);
         color:var(--tx-5); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.8px;
         padding:14px 12px 6px; margin-top:6px; cursor:pointer; text-align:left; }
  .grp .seta { margin-left:auto; font-size:9px; transition:transform .15s; }
  .grp.aberto .seta { transform:rotate(90deg); }
  .itens { display:none; flex-direction:column; gap:2px; }
  .grp.aberto + .itens { display:flex; }
  .rodape { margin-top:auto; padding:12px 6px 0; border-top:1px solid var(--line); display:flex; align-items:center; gap:8px;
            font-size:11px; color:var(--tx-5); }
  .rodape span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .top { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); min-height:52px; }
  .ham { display:block; background:none; border:none; color:var(--tx-1); font-size:20px; cursor:pointer; padding:2px 6px; }
  @media (min-width:761px) { .app.menu-fechado .side { display:none; } }
  .ti { font-weight:800; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acoes { margin-left:auto; display:flex; gap:8px; flex-shrink:0; }
  .btn { background:var(--surface-2); border:1px solid var(--line); color:var(--tx-2); border-radius:8px;
         padding:6px 12px; font-size:12.5px; font-weight:700; cursor:pointer; text-decoration:none; }
  .btn:hover { border-color:var(--brand); color:var(--tx-1); }
  /* seletor de loja único (28/10/2026) */
  .vendo { display:flex; align-items:center; gap:6px; flex-shrink:0; font-size:13px; font-weight:700; color:var(--marca-amarelo);
           border:2px solid var(--marca-amarelo); border-radius:999px; padding:3px 6px 3px 12px; margin-left:8px;
           background:rgba(246,198,62,.10); }
  .vendo:empty { display:none; }
  .vendo b { color:var(--tx-1); font-size:14.5px; padding-right:8px; }
  .vendo select { background:var(--bg); border:1px solid var(--marca-amarelo); color:var(--tx-1); border-radius:999px;
                  padding:5px 10px; font:inherit; font-size:14.5px; font-weight:800; cursor:pointer; }
  .vendo .sem { color:var(--farol-fora); font-weight:700; }
  .home-loja { max-width:900px; margin:14px auto 0; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
               border:2px solid var(--marca-amarelo); border-radius:12px; padding:10px 14px; background:rgba(246,198,62,.10);
               color:var(--marca-amarelo); font-weight:700; }
  .home-loja b { color:var(--tx-1); }
  .home-loja-op { display:flex; flex-wrap:wrap; gap:6px; }
  .faixa-loja { padding:7px 16px; font-size:12.5px; color:var(--tx-2); background:var(--surface-2); border-bottom:1px solid var(--line); }
  .faixa-loja[hidden] { display:none; }
  @media (max-width:760px) { .vendo .rot { display:none; } }
  .vista { flex:1; position:relative; min-height:0; }
  .vista > * { position:absolute; inset:0; }
  .vista iframe { width:100%; height:100%; border:0; background:var(--bg); }
  .carregando { display:flex; align-items:center; justify-content:center; color:var(--tx-3); pointer-events:none; }

  .home { overflow-y:auto; padding:28px 16px 48px; }
  .home-cab { max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:4px; }
  .home h1 { margin:0; font-size:22px; font-weight:800; }
  .home .sub { color:var(--tx-3); font-size:13px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; max-width:900px; margin:8px auto 0; }
  .gh { grid-column:1/-1; color:var(--tx-5); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; margin:18px 2px 0; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; text-align:left;
          cursor:pointer; color:inherit; display:flex; flex-direction:column; gap:4px; }
  .card:hover { border-color:var(--brand); }
  .card .t { font-weight:800; font-size:14.5px; display:flex; gap:8px; align-items:center; }
  .card .d { color:var(--tx-3); font-size:12.5px; line-height:1.4; }
  .card .n { color:var(--tx-5); font-size:11.5px; margin-top:2px; }
  .card.vazio { opacity:.55; cursor:default; }
  .abas { display:flex; gap:6px; max-width:900px; margin:12px auto 0; }
  .aba { background:var(--surface); border:1px solid var(--line); color:var(--tx-2); border-radius:999px; padding:7px 16px;
         font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .aba.on { background:var(--brand); border-color:var(--brand); color:var(--tx-1); }
  .voltar { background:none; border:none; color:var(--tx-3); font:inherit; font-size:13px; cursor:pointer; padding:0; }

  #porta { position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; }
  #porta[hidden] { display:none; }
  .porta-caixa { width:100%; max-width:340px; border-radius:16px; padding:30px 26px; text-align:center;
                 background:linear-gradient(135deg,var(--marca-amarelo),var(--marca-laranja) 70%,var(--marca-laranja-q)); }
  .porta-caixa img { height:56px; width:56px; border-radius:13px; object-fit:cover; display:block; margin:0 auto 12px; }
  .porta-caixa h2 { color:var(--bg); font-size:18px; font-weight:800; margin:0 0 6px; }
  .porta-caixa p { color:var(--tx-6); font-size:12.5px; margin:0 0 18px; }
  .porta-caixa input { width:100%; background:var(--tx-1); border:1px solid var(--bg); color:var(--bg); border-radius:10px;
                       padding:12px 14px; font-size:16px; margin-bottom:10px; outline:none; text-align:center; }
  .porta-caixa button { width:100%; background:var(--bg); border:none; color:var(--marca-amarelo); font-size:14px; font-weight:800;
                        padding:12px; border-radius:10px; cursor:pointer; }
  .porta-erro { color:var(--bg); background:rgba(255,255,255,.55); border-radius:8px; font-size:12.5px; margin-top:10px; padding:6px 8px; }
  .porta-erro:empty { display:none; }

  .veu { display:none; position:fixed; inset:0; z-index:45; background:rgba(0,0,0,.5); }
  @media (max-width:760px) {
    .side { position:fixed; inset:0 auto 0 0; z-index:50; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 40px rgba(0,0,0,.6); }
    .side.aberta { transform:none; }
    /* véu atrás da gaveta: tocar fora fecha o menu (pedido do dono, 15/10/2026). Sem ele
       o toque caía dentro da moldura do painel, que é outra página e não avisa a casca. */
    .side.aberta + .veu { display:block; }
    .ham { display:block; }
    .acoes .so-largo { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { .side, .grp .seta { transition:none; } }
</style>
</head>
<body>

<div id="porta" hidden>
  <form class="porta-caixa" id="portaForm" autocomplete="on">
    <img src="logo-preta.png" onerror="this.onerror=null;this.src='logo.png';" alt="Cidadão do Mundo">
    <h2>PAINEL CDM</h2>
    <p>Acesso restrito. Entre com seu e-mail e senha.</p>
    <input type="text" autocapitalize="none" autocorrect="off" spellcheck="false" id="portaEmail" placeholder="seu nome (ex.: rita)" autocomplete="username" required>
    <input type="password" id="portaSenha" placeholder="Senha" autocomplete="current-password" required>
    <button type="submit" id="portaBtn">Entrar</button>

</div>

<div class="app">

    <div class="marca"><img src="logo.png" alt=""><span>Cidadão do Mundo</span></div>
    <button class="mi" id="miInicio" type="button"><span class="ic">🏠</span>Início</button>
    <nav id="menu"></nav>
    <div class="rodape"><span id="quem"></span><button class="btn" type="button" id="btnSair">Sair</button></div>
  </aside>
  <div class="veu" id="veu"></div>
  <div class="main">
    <div class="top">
      <button class="ham" type="button" id="btnHam" aria-label="Abrir o menu">☰</button>
      <div class="ti" id="titulo">Início</div>
      <div class="vendo" id="vendo"></div>
      <div class="acoes" id="acoes"></div>
    </div>
    <div class="faixa-loja" id="faixaLoja" hidden></div>
    <div class="vista" id="vista"></div>
  </div>
</div>

<script src="casca/menu.js?v=20261030n"></script>
<script src="casca/paginas.js?v=20261031a"></script>
<script src="casca/modulos.js?v=20261030n"></script>
<script src="nucleo/loja.js?v=20261028a"></script>
<script>
const SUPABASE_URL = 'https://rtmgzsikwglsvpopbfbw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0bWd6c2lrd2dsc3Zwb3BiZmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NDgwMjcsImV4cCI6MjEwMTQyNDAyN30.-vwbQkcuAbbonmBVCeUWXjTg54uB5MNN94QmMlBxTA4';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const MENU = Array.isArray(window.CASCA_MENU) ? window.CASCA_MENU : [];
const PAGINAS = window.CASCA_PAGINAS || {};
const ITENS = {};                       // chave -> { rotulo, icone, link, grupo }
MENU.forEach((g) => g.itens.forEach((i) => { ITENS[i.chave] = Object.assign({ grupo: g.id }, i); }));
// TELAS SÓ DA CASCA, em validação com o dono (15/10/2026): existem no painel mas não têm
// botão no menu dele, por isso não vêm do menu.js. Ficam no alto, logo abaixo do Início.
// Quando o dono validar, a tela ganha botão no painel e sai daqui.
const SO_NA_CASCA = [{ chave: 'hoje', rotulo: 'Hoje na rede', icone: '📍' }];
SO_NA_CASCA.forEach((i) => { ITENS[i.chave] = Object.assign({ grupo: null }, i); });

// FORMATO A (22/10/2026): os módulos de casca/modulos.js. Tela do menu que não está em nenhum módulo cai em "Outras
// telas" — nada some por esquecimento.
const MODULOS = (Array.isArray(window.CASCA_MODULOS) ? window.CASCA_MODULOS : []).map((m) => Object.assign({}, m));
(function outrasTelas() {
  const usadas = new Set(MODULOS.flatMap((m) => [...(m.lancar || []), ...(m.acompanhar || [])]));
  const sobra = Object.keys(ITENS).filter((k) => !usadas.has(k));
  if (sobra.length) MODULOS.push({ id: 'outras', nome: 'Outras telas', icone: '📁', lancar: [], acompanhar: sobra });
})();
let MODULO_ATUAL = null, ABA_ATUAL = 'lancar';
function telasDo(m, aba) { return (m[aba] || []).filter((k) => ITENS[k] && visivel(k)); }
let PODE = null;                        // null = vê tudo (regra do painel_acesso)
let DESC = {};                          // chave -> painel_telas.responde
let ATUAL = null;                       // chave aberta (null = Início)
let PAINEL_PRONTO = false;              // o painel antigo terminou de carregar os dados
let PAINEL_ALVO = null;                 // tela que o painel deve mostrar quando ficar pronto
const MOLDURAS = {};                    // url -> iframe

// ------------------------------------------------------------- sessão
function sessao() { try { return JSON.parse(localStorage.getItem('rmbSessao') || 'null'); } catch (e) { return null; } }
function gravarSessao(d, email) {
  localStorage.setItem('rmbSessao', JSON.stringify({
    access_token: d.access_token, refresh_token: d.refresh_token,
    email: (d.user && d.user.email) || email,
    expira_em: Date.now() + ((d.expires_in || 3600) * 1000),
  }));
}
function cabecalho() {
  const s = sessao();
  return { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + ((s && s.access_token) || SUPABASE_ANON_KEY) };
}
// Só roda na abertura, antes de existir moldura (ver o comentário do topo).
async function renovarNaAbertura() {
  const s = sessao();
  if (!s || !s.refresh_token) return false;
  const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
    method: 'POST', headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: s.refresh_token }) });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok || !d.access_token) {
    if (r.status === 400 || r.status === 401) localStorage.removeItem('rmbSessao');
    return false;
  }
  gravarSessao(d, s.email);
  return true;
}
async function sessaoValida() {
  const s = sessao();
  if (!s || !s.access_token) return false;
  if (s.expira_em && s.expira_em - Date.now() < 120000) await renovarNaAbertura();
  let r = await fetch(SUPABASE_URL + '/auth/v1/user', { headers: cabecalho() });
  if (r.status === 401 && await renovarNaAbertura()) r = await fetch(SUPABASE_URL + '/auth/v1/user', { headers: cabecalho() });
  if (r.ok) return true;
  if (r.status === 401 || r.status === 403) { localStorage.removeItem('rmbSessao'); return false; }
  throw new Error('sem conexão com o servidor (' + r.status + ')');
}

function mostrarPorta(recado) {
  Object.keys(MOLDURAS).forEach((u) => { MOLDURAS[u].remove(); delete MOLDURAS[u]; });
  PAINEL_PRONTO = false;
  $('porta').hidden = false;
  $('portaErro').textContent = recado || '';
  setTimeout(() => { try { $('portaEmail').focus(); } catch (e) {} }, 50);
}

$('portaForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  // 29/10/2026 (dono): só o nome basta — "rita" vira rita@cidadaodomundo.com.br
  const email = ((t) => { t = String(t || '').trim(); return !t || t.includes('@') ? t : t.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '').toLowerCase() + '@cidadaodomundo.com.br'; })($('portaEmail').value), senha = $('portaSenha').value;
  if (!email || !senha) { $('portaErro').textContent = 'Preencha e-mail e senha.'; return; }
  $('portaBtn').disabled = true; $('portaBtn').textContent = 'Entrando...';
  try {
    const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST', headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: senha }) });
    const d = await r.json();
    if (!r.ok || !d.access_token) {
      $('portaErro').textContent = (d.error_description || d.msg || 'E-mail ou senha errados.') + ' Se você ainda não tem conta, peça ao Neto para criar.';
      $('portaSenha').value = '';
      return;
    }
    gravarSessao(d, email);
    LOJA_INFO = null; try { sessionStorage.removeItem('painelLoja'); } catch (x) {}
    $('portaSenha').value = '';
    $('porta').hidden = true;
    await montar();
  } catch (e) {
    $('portaErro').textContent = 'Não consegui falar com o servidor: ' + e.message;
  } finally {
    $('portaBtn').disabled = false; $('portaBtn').textContent = 'Entrar';
  }
});

$('btnSair').addEventListener('click', () => {
  localStorage.removeItem('rmbSessao');
  location.replace('sistema.html');
});

// A sessão é compartilhada com o painel: se ele derrubar o login (senha trocada,
// sessão recusada), a casca fica sabendo pelo evento de storage e volta para a porta.
window.addEventListener('storage', (e) => {
  if (e.key === 'rmbSessao' && !e.newValue && $('porta').hidden) mostrarPorta('Sua sessão acabou. Entre de novo.');
});

// ------------------------------------------------------- loja (28/10/2026)
// Telas que já seguem a loja do topo (passo 2 da proposta, módulo a módulo). As outras ganham a faixa abaixo.
const TELAS_POR_LOJA = new Set(window.CASCA_TELAS_POR_LOJA || []);
function desenharLoja() {
  const v = $('vendo');
  if (!LOJA_INFO) { v.innerHTML = ''; return; }                       // o banco não respondeu: não inventa loja
  if (!LOJA_INFO.lojas.length) { v.innerHTML = '<span class="sem">sem loja cadastrada — fale com o Neto</span>'; return; }
  const atual = lojaAtual();
  v.innerHTML = LOJA_INFO.travado
    ? `<span class="rot">📍 Vendo:</span> <b>${esc(lojaNome(atual))}</b>`
    : `<span class="rot">📍 Vendo:</span> <select id="selLoja" aria-label="Loja">${LOJA_INFO.lojas.map((l) =>
        `<option value="${esc(l)}"${l === atual ? ' selected' : ''}>${esc(lojaNome(l))}</option>`).join('')}</select>`;
  const s = $('selLoja');
  if (s) s.onchange = () => trocarLoja(s.value);
}
function trocarLoja(l) {
  if (!lojaEscolher(l)) return;
  Object.values(MOLDURAS).forEach((f) => { try { f.contentWindow.postMessage({ tipo: 'casca-loja', loja: l }, location.origin); } catch (e) {} });
  desenharLoja();
  atualizarFaixaLoja();
  if (ATUAL === null && MODULO_ATUAL === null && $('vista').querySelector('.home')) inicio();   // o cartão do Início
}
function atualizarFaixaLoja() {
  const f = $('faixaLoja'), l = lojaAtual();
  const mostra = !!(ATUAL && l && l !== LOJA_REDE && !lojaTravada() && !TELAS_POR_LOJA.has(ATUAL));
  f.hidden = !mostra;
  if (mostra) f.textContent = `Esta tela ainda não separa pela loja escolhida em cima: o que aparece aqui não é só de ${lojaNome(l)}.`;
}

// -------------------------------------------------------------- menu
// tela só de quem vê pessoal: quem não vê não acha no menu (o banco também recusa)
const SO_PESSOAL = new Set(['macertos']);
let VE_PESSOAL = null;
// tela só de DONO e FINANCEIRO
const SO_GESTAO = new Set(['lojaempresas']);
let VE_GESTAO = null;
function visivel(chave) {
  const it = ITENS[chave];
  if (!it) return false;
  if (SO_PESSOAL.has(chave) && VE_PESSOAL === false) return false;
  if (SO_GESTAO.has(chave) && VE_GESTAO === false) return false;
  if (!PODE) return true;
  if (it.link) return false;                     // atalhos também somem para acesso restrito (igual ao painel)
  return PODE.includes(chave);
}
let GRUPOS_ABERTOS = {};
try { GRUPOS_ABERTOS = JSON.parse(localStorage.getItem('cascaGrupos') || '{}') || {}; } catch (e) {}

function desenharMenu() {
  let h = SO_NA_CASCA.filter((i) => visivel(i.chave)).map((i) =>
    `<button class="mi${i.chave === ATUAL ? ' on' : ''}" type="button" data-chave="${esc(i.chave)}"><span class="ic">${esc(i.icone)}</span>${esc(i.rotulo)}</button>`).join('');
  // 22/10/2026: o menu segue os MÓDULOS do formato A (o mesmo agrupamento dos cartões do Início)
  MODULOS.forEach((g) => {
    const itens = [...telasDo(g, 'lancar'), ...telasDo(g, 'acompanhar')].filter((k) => k !== 'hoje').map((k) => Object.assign({ chave: k }, ITENS[k]));
    if (!itens.length) return;
    const tem = itens.some((i) => i.chave === ATUAL);
    const aberto = tem || GRUPOS_ABERTOS[g.id] || PODE;   // acesso restrito: tudo aberto, são poucas telas
    h += `<button class="grp${aberto ? ' aberto' : ''}" type="button" data-grupo="${esc(g.id)}" aria-expanded="${aberto ? 'true' : 'false'}">${esc(g.nome)}<span class="seta">▶</span></button>`;
    h += '<div class="itens">' + itens.map((i) =>
      `<button class="mi${i.chave === ATUAL ? ' on' : ''}" type="button" data-chave="${esc(i.chave)}"><span class="ic">${esc(i.icone)}</span>${esc(i.rotulo)}${i.link ? ' ↗' : ''}</button>`
    ).join('') + '</div>';
  });
  $('menu').innerHTML = h;
  $('miInicio').classList.toggle('on', ATUAL === null);
}

$('menu').addEventListener('click', (e) => {
  const g = e.target.closest('.grp');
  if (g) {
    const aberto = !g.classList.contains('aberto');
    g.classList.toggle('aberto', aberto); g.setAttribute('aria-expanded', aberto ? 'true' : 'false');
    GRUPOS_ABERTOS[g.dataset.grupo] = aberto;
    try { localStorage.setItem('cascaGrupos', JSON.stringify(GRUPOS_ABERTOS)); } catch (x) {}
    return;
  }
  const b = e.target.closest('.mi');
  if (b) abrir(b.dataset.chave);
});
$('miInicio').addEventListener('click', () => inicio());
function ehCelular() { return window.matchMedia('(max-width:760px)').matches; }
$('btnHam').addEventListener('click', () => {
  if (ehCelular()) { $('side').classList.toggle('aberta'); return; }
  const fechado = document.querySelector('.app').classList.toggle('menu-fechado');
  $('btnHam').title = fechado ? 'Mostrar o menu' : 'Esconder o menu';
  try { localStorage.setItem('cascaMenuFechado', fechado ? '1' : '0'); } catch (e) {}
});
try {
  if (localStorage.getItem('cascaMenuFechado') === '1') document.querySelector('.app').classList.add('menu-fechado');
} catch (e) {}
$('btnHam').title = document.querySelector('.app').classList.contains('menu-fechado') ? 'Mostrar o menu' : 'Esconder o menu';
$('veu').addEventListener('click', () => $('side').classList.remove('aberta'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('side').classList.remove('aberta'); });

// ---------------------------------------------------------- molduras
function urlDoPainel(chave) { return 'dashboard.html?casca=1' + (chave ? '&m=' + encodeURIComponent(chave) : ''); }
// 30/10/2026 (dono): link que cai direto numa aba, ex.: sistema.html#cargos/fcaixa. Vale só na abertura; o login não perde o endereço.
let ABA_PEDIDA = null;

function moldura(chave) {
  // tela que já saiu do painel abre a página dela; o resto abre no painel antigo
  const url = PAGINAS[chave] || 'painel';
  if (!MOLDURAS[url]) {
    const f = document.createElement('iframe');
    f.title = url === 'painel' ? 'Painel' : (ITENS[chave] || {}).rotulo || url;
    f.setAttribute('allow', 'fullscreen; screen-wake-lock; clipboard-write');
    if (url === 'painel') { PAINEL_PRONTO = false; PAINEL_ALVO = chave; f.src = urlDoPainel(chave); }
    else f.src = ABA_PEDIDA ? url.replace('#', '?aba=' + encodeURIComponent(ABA_PEDIDA) + '#') : url;
    f.hidden = true;
    $('vista').appendChild(f);
    MOLDURAS[url] = f;
  }
  return { url, f: MOLDURAS[url] };
}

function mostrarSo(el) {
  [...$('vista').children].forEach((c) => { c.hidden = c !== el; });
}

function abrir(chave, deDentro) {
  const it = ITENS[chave];
  if (!it || !visivel(chave)) { inicio(); return; }
  if (it.link) { window.open(it.link, '_blank', 'noopener'); return; }
  ATUAL = chave;
  $('titulo').textContent = it.icone + ' ' + it.rotulo;
  atualizarFaixaLoja();
  history.replaceState(null, '', '#' + chave);
  $('side').classList.remove('aberta');
  desenharMenu();
  const jaAberta = !!MOLDURAS[PAGINAS[chave] || 'painel'];
  const { url, f } = moldura(chave);
  mostrarSo(f);
  // página própria reaberta: recarrega os dados da tela, como o painel antigo faz no mostrarModulo (24/10/2026)
  if (url !== 'painel' && jaAberta && !deDentro) { try { if (typeof f.contentWindow.reentrarTela === 'function') f.contentWindow.reentrarTela(); } catch (e) {} }
  let botoes = '<button class="btn" type="button" id="btnRecarregar" title="Recarregar a tela">↻</button>';
  if (url !== 'painel') botoes += `<a class="btn so-largo" href="${esc(url)}" target="_blank" rel="noopener">↗ abrir</a>`;
  $('acoes').innerHTML = botoes;
  $('btnRecarregar').onclick = () => {
    if (url === 'painel') { PAINEL_PRONTO = false; PAINEL_ALVO = ATUAL; f.src = urlDoPainel(ATUAL); } else f.src = url;
  };
  if (url === 'painel' && !deDentro) {
    if (PAINEL_PRONTO && f.contentWindow && typeof f.contentWindow.mostrarModulo === 'function') {
      f.contentWindow.mostrarModulo(chave);
    } else {
      PAINEL_ALVO = chave;                    // aplicado quando o painel avisar que está pronto
    }
  }
}

// O painel antigo conversa com a casca por mensagem (só da mesma origem).
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin || !e.data || typeof e.data !== 'object') return;
  const f = MOLDURAS.painel;
  // página própria (Listas, Estoque, 24/10/2026): atalho para outra tela e aviso de sessão vencida
  if (!f || e.source !== f.contentWindow) {
    const daPagina = Object.values(MOLDURAS).some((m) => m.contentWindow === e.source);
    if (!daPagina) return;
    if (e.data.tipo === 'casca-modulo' && ITENS[e.data.nome] && e.data.nome !== ATUAL) abrir(e.data.nome);
    else if (e.data.tipo === 'casca-login') mostrarPorta(e.data.recado || 'Sua sessão acabou. Entre de novo.');
    else if (e.data.tipo === 'casca-loja-pedir') trocarLoja(e.data.loja);   // a tela pediu uma loja (ex.: Estoque na Rede)
    return;
  }
  if (e.data.tipo === 'casca-loja-pedir') { trocarLoja(e.data.loja); return; }   // clicar numa loja da tabela troca a loja do topo
  if (e.data.tipo === 'casca-pronto') {
    PAINEL_PRONTO = true;
    const atual = e.data.modulo;
    if (PAINEL_ALVO && PAINEL_ALVO !== atual && typeof f.contentWindow.mostrarModulo === 'function') {
      f.contentWindow.mostrarModulo(PAINEL_ALVO);
    }
    PAINEL_ALVO = null;
  } else if (e.data.tipo === 'casca-modulo') {
    // a tela mudou por dentro (atalho do Placar, link de um módulo para outro)
    if (ITENS[e.data.nome] && ATUAL !== null && ATUAL !== e.data.nome && !PAGINAS[e.data.nome]) abrir(e.data.nome, true);
  } else if (e.data.tipo === 'casca-login') {
    mostrarPorta(e.data.recado || 'Sua sessão acabou. Entre de novo.');
  }
});

// -------------------------------------------------------------- início
function inicio() {
  ATUAL = null;
  atualizarFaixaLoja();
  history.replaceState(null, '', location.pathname);
  $('titulo').textContent = 'Início';
  $('acoes').innerHTML = '';
  $('side').classList.remove('aberta');
  desenharMenu();
  let casa = $('vista').querySelector('.home');
  if (!casa) { casa = document.createElement('div'); casa.className = 'home'; $('vista').appendChild(casa); }
  const s = sessao() || {};
  MODULO_ATUAL = null;
  // FORMATO A (22/10/2026): um cartão por módulo, com quantas telas tem para lançar e para acompanhar
  let h = `<div class="home-cab"><h1>Painel Cidadão do Mundo</h1><div class="sub">${esc(s.email || '')} · escolha um módulo</div></div>`;
  // 28/10/2026: a loja que se está vendo, logo na entrada (a mesma do seletor do topo)
  if (LOJA_INFO && LOJA_INFO.lojas.length) {
    const la = lojaAtual();
    h += `<div class="home-loja"><span>📍 Você está vendo: <b>${esc(lojaNome(la))}</b></span>${LOJA_INFO.travado ? '' :
      `<span class="home-loja-op">${LOJA_INFO.lojas.map((l) => `<button type="button" class="aba${l === la ? ' on' : ''}" data-loja="${esc(l)}">${esc(lojaNome(l))}</button>`).join('')}</span>`}</div>`;
  }
  h += `<div class="cards">`;
  MODULOS.forEach((m) => {
    const nl = telasDo(m, 'lancar').length, na = telasDo(m, 'acompanhar').length;
    if (!nl && !na && !m.emConstrucao) return;           // acesso restrito: só os módulos com tela dele
    if (!nl && !na && PODE) return;
    const n = m.emConstrucao && !nl && !na ? 'em construção'
      : [nl ? `${nl} para lançar` : '', na ? `${na} para acompanhar` : ''].filter(Boolean).join(' · ');
    h += `<button class="card${!nl && !na ? ' vazio' : ''}" type="button" data-modulo="${esc(m.id)}"><span class="t"><span>${esc(m.icone)}</span>${esc(m.nome)}</span><span class="n">${n}</span></button>`;
  });
  h += '</div>';
  casa.innerHTML = h;
  registrarUsoCasca('inicio');
  casa.onclick = (e) => {
    const lj = e.target.closest('[data-loja]');
    if (lj) { trocarLoja(lj.dataset.loja); return; }
    const c = e.target.closest('[data-modulo]');
    if (c && !c.classList.contains('vazio')) { abrirModulo(c.dataset.modulo); return; }
    const t = e.target.closest('[data-chave]');
    if (t) abrir(t.dataset.chave);
  };
  mostrarSo(casa);
}
function abrirModulo(id, aba) {
  const m = MODULOS.find((x) => x.id === id);
  if (!m) { inicio(); return; }
  MODULO_ATUAL = id;
  const nl = telasDo(m, 'lancar').length;
  ABA_ATUAL = aba || (nl ? 'lancar' : 'acompanhar');
  $('titulo').textContent = m.icone + ' ' + m.nome;
  const casa = $('vista').querySelector('.home');
  const lista = telasDo(m, ABA_ATUAL);
  let h = `<div class="home-cab"><button class="voltar" type="button" data-inicio="1">← Início</button><h1>${esc(m.icone)} ${esc(m.nome)}</h1></div>
    <div class="abas">${['lancar', 'acompanhar'].map((a) => `<button class="aba${a === ABA_ATUAL ? ' on' : ''}" type="button" data-aba="${a}">${a === 'lancar' ? 'Lançar' : 'Acompanhar'} (${telasDo(m, a).length})</button>`).join('')}</div>
    <div class="cards">`;
  h += lista.length ? lista.map((k) => { const i = ITENS[k];
    return `<button class="card" type="button" data-chave="${esc(k)}"><span class="t"><span>${esc(i.icone)}</span>${esc(i.rotulo)}${i.link ? ' ↗' : ''}</span>` +
      (DESC[k] ? `<span class="d">${esc(DESC[k])}</span>` : '') + '</button>'; }).join('')
    : `<div class="gh" style="text-transform:none; letter-spacing:0;">${ABA_ATUAL === 'lancar' ? 'Nada para lançar neste módulo.' : 'Nada para acompanhar neste módulo.'}</div>`;
  h += '</div>';
  casa.innerHTML = h;
  casa.onclick = (e) => {
    if (e.target.closest('[data-inicio]')) { inicio(); return; }
    const a = e.target.closest('[data-aba]');
    if (a) { abrirModulo(id, a.dataset.aba); return; }
    const t = e.target.closest('[data-chave]');
    if (t) abrir(t.dataset.chave);
  };
  mostrarSo(casa);
}

// O Início da casca também entra na medição de uso (as telas do painel registram lá dentro).
function registrarUsoCasca(tela) {
  try {
    fetch(SUPABASE_URL + '/rest/v1/rpc/painel_registrar_uso', {
      method: 'POST', keepalive: true, headers: Object.assign(cabecalho(), { 'Content-Type': 'application/json' }),
      body: JSON.stringify({ p_tela: tela, p_origem: 'casca' }) }).catch(() => {});
  } catch (e) {}
}

// ------------------------------------------------------------ abertura
async function carregarAcesso() {
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/meus_modulos', {
      method: 'POST', headers: Object.assign(cabecalho(), { 'Content-Type': 'application/json' }), body: '{}' });
    if (!r.ok) return null;
    const m = await r.json();
    return (Array.isArray(m) && m.length) ? m : null;
  } catch (e) { return null; }             // na dúvida, não tranca ninguém fora (igual ao painel)
}
async function carregarVePessoal() {
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/pode_ver_pessoal', {
      method: 'POST', headers: Object.assign(cabecalho(), { 'Content-Type': 'application/json' }), body: '{}' });
    return r.ok ? (await r.json()) === true : null;
  } catch (e) { return null; }
}
async function carregarVeGestao() {
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/tr_meu_papel', {
      method: 'POST', headers: Object.assign(cabecalho(), { 'Content-Type': 'application/json' }), body: '{}' });
    return r.ok ? ['DONO', 'FINANCEIRO'].includes(await r.json()) : null;
  } catch (e) { return null; }
}
async function carregarDescricoes() {
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/painel_telas?select=chave,responde', { headers: cabecalho() });
    if (!r.ok) return {};
    const d = {}; (await r.json()).forEach((t) => { if (t.responde) d[t.chave] = t.responde; });
    return d;
  } catch (e) { return {}; }
}

async function montar() {
  $('quem').textContent = (sessao() || {}).email || '';
  [PODE, DESC, , VE_PESSOAL, VE_GESTAO] = await Promise.all([carregarAcesso(), carregarDescricoes(), lojaCarregar(), carregarVePessoal(), carregarVeGestao()]);
  desenharLoja();
  const [pedido, abaPedida] = decodeURIComponent(location.hash.replace('#', '')).split('/');
  const minhas = Object.keys(ITENS).filter((k) => visivel(k) && !ITENS[k].link);
  if (pedido && visivel(pedido)) { ABA_PEDIDA = abaPedida || null; abrir(pedido); ABA_PEDIDA = null; }
  else if (PODE && minhas.length) abrir(minhas[0]);     // acesso restrito abre direto no que é dele, como o painel
  else inicio();
}

(async function abrirCasca() {
  if (!MENU.length) { document.body.textContent = 'O menu da casca (casca/menu.js) não carregou.'; return; }
  desenharMenu();
  try {
    if (!(await sessaoValida())) { mostrarPorta(); return; }
  } catch (e) { mostrarPorta('Não consegui falar com o servidor. Confira a internet e entre de novo.'); return; }
  await montar();
})();
</script>
